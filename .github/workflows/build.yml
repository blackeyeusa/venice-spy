name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Keystore ready
        id: ks
        run: |
          if [ -f keystore.b64 ]; then
            base64 -d keystore.b64 > app/keystore.jks
            echo "Keystore reused"
          else
            keytool -genkeypair -v -keystore app/keystore.jks -alias venice \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass venice123 -keypass venice123 \
              -dname "CN=Venice Spy, OU=Dev, O=Venice, L=Dhaka, S=Dhaka, C=BD"
            base64 -w0 app/keystore.jks > keystore.b64
            echo "new=1" >> $GITHUB_OUTPUT
          fi

      - name: Save keystore to repo (first run only)
        if: steps.ks.outputs.new == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add keystore.b64
          git commit -m "chore: add signing keystore"
          git push

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace
        env:
          KS_PASS: venice123
          KS_ALIAS: venice

      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk venice-spy.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Venice Spy — latest"
          files: venice-spy.apk
          make_latest: true